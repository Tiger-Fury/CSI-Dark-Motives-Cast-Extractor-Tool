name: Build and check Windows app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build CSI-Cast-Tool.sln -c Release -m:1
      - name: Run fixture checks
        run: dotnet run --project tests/CSI.CastTool.Checks -c Release --no-build
      - name: Publish standalone Windows x64
        run: dotnet publish src/CSI.CastTool/CSI.CastTool.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - name: Include documentation
        shell: pwsh
        run: Copy-Item README.md,LICENSE,THIRD-PARTY-NOTICES.md artifacts/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: CSI-Cast-Tool-Windows-x64
          path: artifacts/win-x64/
